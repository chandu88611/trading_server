services:
  server-0:
    container_name: trading-server-0
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DB_HOST: ${DOCKER_DB_HOST:-kite-postgres}
      DB_PORT: ${DOCKER_DB_PORT:-5432}
    command: ["npm", "start"]
    restart: unless-stopped
    init: true
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - trading_db
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const http=require('http'); const port=Number(process.env.PORT||3000); const req=http.get({host:'127.0.0.1', port, path:'/health', timeout:3000}, (res)=>process.exit(res.statusCode===200?0:1)); req.on('error', ()=>process.exit(1)); req.on('timeout', ()=>{req.destroy(); process.exit(1);});"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  trading_db:
    external: true
    name: trading_db_default
